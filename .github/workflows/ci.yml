name: ci-check
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dedupe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js version from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
      - name: Run yarn dedupe
        run: yarn dedupe --check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js version from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install
      - name: Run build
        run: yarn build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Run CDN (dist) build
        run: yarn build:dist
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js version from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install
      - name: Check formatting of project files (staged)
        if: ${{ github.event_name == 'pull_request' }}
        run: yarn format:diff
      - name: Check formatting of project files (non-staged)
        if: ${{ github.event_name != 'pull_request' }}
        run: yarn format

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js version from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install
      - name: Lint
        run: yarn lint && yarn lint:styles

  license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js version from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install
      - name: License check
        run: yarn lint:license

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js version from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install
      - name: Run build
        run: yarn build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Run tests
        run: yarn test

  v12:
    # The v12 lane: its checks (leaks, motion literals, motion only through
    # @carbon-labs/v12-motion), the motion contract, the component catalog,
    # the design sync's snapshots, its packages' tests and their size, the v12
    # Storybook build and the scene tier on it.
    # Pinned: Playwright has no browser builds for newer Ubuntu releases yet.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The scene tier picks its stories from the change: the commit and
          # its first parent, the base branch's tip for a pull request.
          fetch-depth: 2
      - name: Use Node.js version from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install
      # The scene tier's browser comes first, so a package mirror that is down
      # fails the job in minutes, not after the build. The browser is cached
      # by Playwright's version; its system libraries and fonts come from apt,
      # tried three times.
      - name: Find the scene tier's Playwright version
        id: playwright
        run: echo "version=$(yarn workspace @carbon-labs/v12-scenes node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache the scene tier's browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install the scene tier's browser
        timeout-minutes: 15
        run: |
          for attempt in 1 2 3; do
            yarn workspace @carbon-labs/v12-scenes playwright install --with-deps chromium && exit 0
            echo "Browser install failed (attempt $attempt); retrying."
            sleep 30
          done
          exit 1
      - name: Run build
        run: yarn build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Check the v12 lane
        run: yarn v12:check
      - name: Check the motion contract is current
        run: yarn v12:contract --check
      - name: Check the component catalog is current
        run: yarn v12:catalog --check
      - name: Check the design sync's snapshots are current
        run: yarn v12:figma snapshot --check
      - name: Run the v12 packages' tests
        run: yarn v12:test
      - name: Test the size check
        run: yarn size:test
      - name: Check the v12 components' size
        run: yarn size:check
      - name: Build the v12 Storybook
        run: yarn workspace @carbon-labs/react storybook:build:v12
      - name: Run the scene tier for the components the change touches
        run: yarn v12:scenes --base HEAD^1
      - name: Upload the scene tier's results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: v12-scenes
          path: tools/v12-scenes/results
          retention-days: 14

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js version from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install
      - name: Run build
        run: yarn build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Run Web Component e2e tests
        working-directory: 'packages/web-components'
        run: yarn test-e2e
