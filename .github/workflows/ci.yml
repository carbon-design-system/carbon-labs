name: ci-check
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dedupe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js version from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
      - name: Run yarn dedupe
        run: yarn dedupe --check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js version from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install
      - name: Run build
        run: yarn build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Run CDN (dist) build
        run: yarn build:dist
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js version from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install
      - name: Check formatting of project files (staged)
        if: ${{ github.event_name == 'pull_request' }}
        run: yarn format:diff
      - name: Check formatting of project files (non-staged)
        if: ${{ github.event_name != 'pull_request' }}
        run: yarn format

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js version from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install
      - name: Lint
        run: yarn lint && yarn lint:styles

  license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js version from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install
      - name: License check
        run: yarn lint:license

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js version from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install
      - name: Run build
        run: yarn build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Run tests
        run: yarn test

  v12:
    # The v12 lane: its checks (leaks, motion literals, motion only through
    # @carbon-labs/v12-motion), the motion contract, the component catalog,
    # its packages' tests and their size, and the v12 Storybook build.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js version from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install
      - name: Run build
        run: yarn build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Check the v12 lane
        run: yarn v12:check
      - name: Check the motion contract is current
        run: yarn v12:contract --check
      - name: Check the component catalog is current
        run: yarn v12:catalog --check
      - name: Run the v12 packages' tests
        run: yarn v12:test
      - name: Check the v12 components' size
        run: yarn size:check
      - name: Build the v12 Storybook
        run: yarn workspace @carbon-labs/react storybook:build:v12

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js version from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install
      - name: Run build
        run: yarn build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Run Web Component e2e tests
        working-directory: 'packages/web-components'
        run: yarn test-e2e
