<html>
  <head>
    <title>@carbon-labs/wc-checklist example</title>
    <meta charset="UTF-8" />
    <link
      rel="stylesheet"
      href="https://1.www.s81c.com/common/carbon-for-ibm-dotcom/tag/v1/latest/plex.css" />
    <link
      rel="stylesheet"
      href="https://1.www.s81c.com/common/carbon/web-components/tag/v2/latest/grid.css" />
    <link
      rel="stylesheet"
      href="https://1.www.s81c.com/common/carbon/web-components/tag/v2/latest/themes.css" />
    <style>
      /* Suppress custom elements until styles are loaded */
      clabs-checklist:not(:defined),
      clabs-checklist-group:not(:defined),
      clabs-checklist-item:not(:defined) {
        display: none;
      }
    </style>
    <script
      type="module"
      src="https://1.www.s81c.com/common/carbon/labs/checklist/v0.0.1/index.min.js"></script>
  </head>
  <body class="cds-theme-zone-white">
    <div class="checklist-example">
      <clabs-checklist
        title="Get started checklist"
        chart-value="0.33"
        chart-label="33% complete"
        view-all-label="View all (10)"
        toggle-label="Toggle"
        toggle-aria-label="Checklist toggle"
        open>
        <clabs-checklist-group title="Section label">
          <clabs-checklist-item
            label="Task name"
            status="completed"></clabs-checklist-item>
          <clabs-checklist-item
            label="Task name"
            status="in progress"
            clickable></clabs-checklist-item>
          <clabs-checklist-item
            label="Task name"
            status="not started"
            clickable></clabs-checklist-item>
          <clabs-checklist-item
            label="Task name"
            status="disabled"></clabs-checklist-item>
          <clabs-checklist-item
            label="Task name"
            status="error"
            clickable></clabs-checklist-item>
        </clabs-checklist-group>
      </clabs-checklist>
    </div>
  </body>
</html>
