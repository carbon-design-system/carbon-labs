<html>
  <head>
    <title>@carbon-labs/wc-checklist example</title>
    <meta charset="UTF-8" />
    <link
      rel="stylesheet"
      href="https://1.www.s81c.com/common/carbon-for-ibm-dotcom/tag/v1/latest/plex.css" />
    <link rel="stylesheet" href="src/styles.scss" />
    <script type="module" src="src/index.js"></script>
  </head>
  <body>
    <div class="checklist-example">
      <clabs-checklist
        title="Get started checklist"
        chart-value="0.33"
        chart-label="33% complete"
        view-all-label="View all (10)"
        toggle-label="Toggle"
        toggle-aria-label="Checklist toggle"
        open>
        <clabs-checklist-group title="Section label">
          <clabs-checklist-item
            label="Task name"
            status="completed"></clabs-checklist-item>
          <clabs-checklist-item
            label="Task name"
            status="in progress"
            clickable></clabs-checklist-item>
          <clabs-checklist-item
            label="Task name"
            status="not started"
            clickable></clabs-checklist-item>
          <clabs-checklist-item
            label="Task name"
            status="disabled"></clabs-checklist-item>
          <clabs-checklist-item
            label="Task name"
            status="error"
            clickable></clabs-checklist-item>
        </clabs-checklist-group>
      </clabs-checklist>
    </div>
  </body>
</html>
